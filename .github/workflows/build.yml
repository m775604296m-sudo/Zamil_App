name: Build APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build with Buildozer
        uses: ArtemSBulgakov/buildozer-action@v1
        with:
          command: buildozer -v android debug
        env:
          PLATFORM: android

      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: Zamil_App_APK
          path: bin/*.apk
