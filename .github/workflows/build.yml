name: Build APK
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install and Build
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev
         
          # تثبيت الأدوات في سطر واحد لضمان الاستمرارية
          pip3 install --user --upgrade buildozer cython virtualenv
         
          # تفعيل المسار وتشغيل بناء التطبيق فوراً في نفس السطر
          export PATH=$PATH:$HOME/.local/bin && buildozer android debug --yes
       
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZamilApp-Package
          path: bin/*.apk
