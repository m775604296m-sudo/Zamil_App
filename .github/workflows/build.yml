name: Build APK
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install and Build
        run: |
          # 1. تحديث النظام وتثبيت المكتبات الأساسية
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev
          
          # 2. تثبيت Buildozer و Cython
          pip3 install --user --upgrade buildozer cython virtualenv
          
          # 3. تفعيل المسار وتشغيل البناء في أمر واحد متصل
          export PATH=$PATH:$HOME/.local/bin
          buildozer android debug --yes
        
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZamilApp-Final
          path: bin/*.apk
