name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' # استخدام 3.10 يحل مشكلة Broken Pipe التي تظهر مع 3.11

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git python3 python3-dev ffmpeg libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev zlib1g-dev libgstreamer1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good libsqlite3-dev sqlite3 bzip2 libbz2-dev libssl-dev openssl libgdbm-dev libgdbm-compat-dev liblzma-dev libreadline-dev libncursesw5-dev libffi-dev uuid-dev libdb5.3-dev
          pip install --upgrade pip
          pip install "cython<3.0.0" wheel # إصدار Cython هذا ضروري جداً لنجاح بناء Kivy
          pip install buildozer

      - name: Build with Buildozer
        run: |
          # تنظيف أي بقايا بناء سابقة لضمان بيئة نظيفة
          rm -rf .buildozer/
          # تشغيل البناء مع الموافقة التلقائية على تراخيص الـ SDK
          yes | buildozer -v android debug
        continue-on-error: false

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Zamil-App-Release
          path: bin/*.apk
